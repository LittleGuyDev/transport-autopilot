name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check ephemeral signing test dependency
        run: openssl version
      - name: Build manual source package
        run: python scripts/build_unsigned.py
      - name: Test installer with synthetic files
        run: python -m unittest discover -s transport-autobuild/installer -p 'test_*.py'
      - name: Test updater with ephemeral keys
        run: python -m unittest discover -s updater -p 'test_*.py'
      - name: Test transport runtime and interface
        run: |
          node transport-autobuild/test-sim.cjs
          node transport-autobuild/test-native-transport.cjs
          node transport-autobuild/test-activation.cjs
          node transport-autobuild/test-manager-ui.cjs
